<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadinux87 - Booting System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: monospace;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
        }

        .efecto-crt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 10000;
            pointer-events: none;
            animation: parpadeoCRT 0.15s infinite;
        }

        @keyframes parpadeoCRT {
            0% { opacity: 0.99; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        .escritorio-sistema {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .imagen-escritorio {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .icono-programa {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
        }

        .icono-programa img {
            width: 60px;
            height: auto;
            image-rendering: pixelated;
        }

        .icono-programa span {
            font-size: 11px;
            color: white;
            margin-top: 5px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 2px 4px;
            border-radius: 3px;
            word-break: break-all;
        }

        .ventana-programa {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 400px;
            border: 3px solid #222;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            flex-direction: column;
            z-index: 100;
        }

        @media (max-width: 600px) {
            .ventana-programa {
                width: 95%;
                height: 70%;
            }
        }

        .ventana-header {
            background: linear-gradient(90deg, #0055ff, #00aaff);
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
        }

        .boton-cerrar {
            background: #ff5555;
            border: 1px solid #aa0000;
            color: white;
            font-family: monospace;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 10px;
        }

        .ventana-cuerpo {
            flex-grow: 1;
            background-image: url('fondo.png');
            background-size: auto;
            position: relative;
            overflow: hidden;
        }

        .sprite {
            position: absolute;
            image-rendering: pixelated;
        }

        #personajeHana {
            width: 50px;
            height: auto;
            transition: transform 0.1s ease, left 0.1s linear, top 0.1s linear;
        }

        #personajeRet {
            width: 55px;
            height: auto;
            bottom: 40px;
            right: 50px;
        }

        .cuadro-dialogo {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #fff;
            padding: 10px;
            font-size: 14px;
            color: #fff;
            font-family: monospace;
            border-radius: 4px;
            z-index: 10;
        }

        .dpad-contenedor {
            display: none;
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 90px;
            height: 90px;
            z-index: 5;
        }

        .dpad-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            border-radius: 4px;
        }

        .btn-arriba { top: 0; left: 30px; }
        .btn-abajo { bottom: 0; left: 30px; }
        .btn-izquierda { top: 30px; left: 0; }
        .btn-derecha { top: 30px; right: 0; }

        .btn-accion-contenedor {
            display: none;
            position: absolute;
            bottom: 30px;
            right: 15px;
            z-index: 5;
        }

        .btn-accion {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .pantalla-booteo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.5s ease-in-out;
            animation: encendidoCRT 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .logo-sadinux {
            max-width: 450px;
            height: auto;
            margin-bottom: 30px;
        }

        .consola-comandos {
            width: 450px;
            height: 120px;
            font-size: 13px;
            color: #aaaaaa;
            text-align: left;
            overflow: hidden;
            line-height: 1.5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .linea-comando {
            white-space: nowrap;
            overflow: hidden;
        }

        @keyframes encendidoCRT {
            0% {
                transform: scaleY(0.01) scaleX(0);
                background: #ffffff;
            }
            40% {
                transform: scaleY(0.01) scaleX(1);
                background: #ffffff;
            }
            100% {
                transform: scaleY(1) scaleX(1);
                background: #000000;
            }
        }

        .desvanecer-boot {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="efecto-crt"></div>

    <div id="escritorio" class="escritorio-sistema">
        <img src="pantalla_inicio.png" alt="Escritorio Sadinux" class="imagen-escritorio">

        <div class="icono-programa" onclick="abrirVentana()">
            <img src="icon.png" alt="Icono Hana Mind">
            <span>Hana_mind.exe</span>
        </div>

        <div id="ventanaHana" class="ventana-programa">
            <div class="ventana-header">
                <span>Hana_mind.exe</span>
                <button class="boton-cerrar" onclick="cerrarVentana()">X</button>
            </div>
            <div class="ventana-cuerpo" id="zonaJuego">
                <img src="Hana.png" id="personajeHana" class="sprite" alt="Hana">
                <img src="ret.png" id="personajeRet" class="sprite" alt="Ret">
                
                <div id="cuadroDialogo" class="cuadro-dialogo"><b>Ret:</b> Miau</div>

                <div id="dpad" class="dpad-contenedor">
                    <div class="dpad-btn btn-arriba" data-dir="up">▲</div>
                    <div class="dpad-btn btn-izquierda" data-dir="left">◀</div>
                    <div class="dpad-btn btn-derecha" data-dir="right">▶</div>
                    <div class="dpad-btn btn-abajo" data-dir="down">▼</div>
                </div>

                <div id="btnAccionCont" class="btn-accion-contenedor">
                    <div class="btn-accion" id="btnInteractuar">●</div>
                </div>
            </div>
        </div>
    </div>

    <div id="capaBoot" class="pantalla-booteo">
        <img src="sadinux_boot.png" alt="Sadinux 87 Logo" class="logo-sadinux">
        <div id="cajaConsola" class="consola-comandos"></div>
    </div>

    <script>
        const listaComandos = [
            "SADINUX KERNEL MULTI-THREAD V0.87 CONFIGURING...",
            "SINK-COMPANY MOTHERBOARD CORE READ: OK",
            "CHECKING FILESYSTEM VIRTUAL MEMORY... 640KB LOADED",
            "CONNECTING TO DEV/SDA1/OCTARION HUB... CONNECTED",
            "MOUNTING INBOUND DATA PACKETS FROM DREAMTOPIA...",
            "DECRYPTING REGISTER_CIVIL_DATABASE BASE SYSTEM...",
            "STARTING GRAPHICAL USER INTERFACE O_GUI.EXE...",
            "SADINUX BOOT SEQUENCE SUCCESSFUL,¥0ÚRS3CR3TŊ0T4M3."
        ];

        const contenedorConsola = document.getElementById("cajaConsola");
        let indiceLinea = 0;

        function imprimirSecuencia() {
            if (indiceLinea < listaComandos.length) {
                const parrafo = document.createElement("div");
                parrafo.className = "linea-comando";
                parrafo.textContent = ">> " + listaComandos[indiceLinea];
                contenedorConsola.appendChild(parrafo);
                indiceLinea++;
                setTimeout(imprimirSecuencia, 750);
            }
        }

        setTimeout(imprimirSecuencia, 800);

        setTimeout(function() {
            document.getElementById("capaBoot").classList.add("desvanecer-boot");
            const esc = document.getElementById("escritorio");
            esc.style.opacity = "1";
        }, 7000);

        const ventana = document.getElementById("ventanaHana");
        const hana = document.getElementById("personajeHana");
        const ret = document.getElementById("personajeRet");
        const dialogo = document.getElementById("cuadroDialogo");
        const zonaJuego = document.getElementById("zonaJuego");
        const dpad = document.getElementById("dpad");
        const btnAccionCont = document.getElementById("btnAccionCont");

        let hanaX = 20;
        let hanaY = 20;
        const velocidad = 15; 
        let ventanaAbierta = false;
        let esMovil = false;

        window.addEventListener('touchstart', function detectTouch() {
            esMovil = true;
            if(ventanaAbierta) mostrarControlesMoviles();
            window.removeEventListener('touchstart', detectTouch);
        });

        function mostrarControlesMoviles() {
            if (esMovil) {
                dpad.style.display = "block";
                btnAccionCont.style.display = "block";
            }
        }

        function abrirVentana() {
            ventana.style.display = "flex";
            ventanaAbierta = true;
            actualizarPosicionHana();
            mostrarControlesMoviles();
            window.addEventListener("keydown", manejarTeclado);
        }

        function cerrarVentana() {
            ventana.style.display = "none";
            ventanaAbierta = false;
            dialogo.style.display = "none";
            dpad.style.display = "none";
            btnAccionCont.style.display = "none";
            window.removeEventListener("keydown", manejarTeclado);
        }

        function actualizarPosicionHana() {
            hana.style.left = hanaX + "px";
            hana.style.top = hanaY + "px";
        }

        function mover(direccion) {
            const limiteX = zonaJuego.clientWidth - 50;
            const limiteY = zonaJuego.clientHeight - 65;

            if (direccion === "up") hanaY = Math.max(0, hanaY - velocidad);
            if (direccion === "down") hanaY = Math.min(limiteY, hanaY + velocidad);
            if (direccion === "left") {
                hanaX = Math.max(0, hanaX - velocidad);
                hana.style.transform = "scaleX(-1)";
            }
            if (direccion === "right") {
                hanaX = Math.min(limiteX, hanaX + velocidad);
                hana.style.transform = "scaleX(1)";
            }
            dialogo.style.display = "none";
            actualizarPosicionHana();
        }

        function manejarTeclado(e) {
            if (!ventanaAbierta) return;
            if (e.key === "ArrowUp") mover("up");
            if (e.key === "ArrowDown") mover("down");
            if (e.key === "ArrowLeft") mover("left");
            if (e.key === "ArrowRight") mover("right");

            if (e.key === "Enter") {
                ejecutarInteraccion();
            }
        }

        document.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const dir = this.getAttribute('data-dir');
                mover(dir);
            });
        });

        document.getElementById('btnInteractuar').addEventListener('touchstart', function(e) {
            e.preventDefault();
            ejecutarInteraccion();
        });

        function ejecutarInteraccion() {
            if (verificarCercania()) {
                dialogo.style.display = "block";
            }
        }

        function verificarCercania() {
            const rectHana = hana.getBoundingClientRect();
            const rectRet = ret.getBoundingClientRect();

            const centroHanaX = rectHana.left + rectHana.width / 2;
            const centroHanaY = rectHana.top + rectHana.height / 2;
            const centroRetX = rectRet.left + rectRet.width / 2;
            const centroRetY = rectRet.top + rectRet.height / 2;

            const distancia = Math.sqrt(Math.pow(centroHanaX - centroRetX, 2) + Math.pow(centroHanaY - centroRetY, 2));
            return distancia < 95;
        }
    </script>
</body>
</html>
