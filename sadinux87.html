 ctx.fillStyle="#e7d7a0";ctx.font=`${Math.min(12,w*.026)}px monospace`;
 const lines=["3 ETAPAS · 9 NIVELES","Etapa 1: alterna entre Zaf y Rub","Etapa 2: juega como Rub","Etapa 3: juega como Zaf","Salta, evita trampas y derrota a los jefes","Pulsa ENTER o toca ● para comenzar"];
 lines.forEach((s,i)=>ctx.fillText(s,w/2,h*.49+i*20));
 ctx.textAlign="left";
}
document.querySelectorAll("[data-hold]").forEach(b=>{
 const key=b.dataset.hold,down=e=>{e.preventDefault();if(key==="jump")saltar();else teclas[key]=true;},up=e=>{e.preventDefault();if(key!=="jump")teclas[key]=false;};
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);
});
document.querySelectorAll("[data-tap]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();if(b.dataset.tap==="switch")cambiarPersonaje();if(b.dataset.tap==="action")accionClan();}));
window.addEventListener("blur",()=>{teclas={};});
</script>
</body>
