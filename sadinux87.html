<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadinux87 - Booting System</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: monospace;
            overflow: hidden;
            color: #ffffff;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .efecto-crt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 10000;
            pointer-events: none;
            animation: parpadeoCRT 0.15s infinite;
        }

        @keyframes parpadeoCRT {
            0% { opacity: 0.99; }
            50% { opacity: 1; }
            100% { opacity: 0.99; }
        }

        .escritorio-sistema {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .contenedor-monitor {
            position: relative;
            height: 100%;
            max-width: 100%;
            aspect-ratio: 4 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .imagen-escritorio {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .icono-programa {
            position: absolute;
            top: 8%;
            left: 5%;
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            z-index: 10;
        }

        /* Segundo icono ubicado un poco más abajo */
        .icono-programa-2 {
            position: absolute;
            top: 25%;
            left: 5%;
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
            z-index: 10;
        }

        .icono-programa img, .icono-programa-2 img {
            width: 50px;
            height: auto;
            image-rendering: pixelated;
        }

        .icono-programa span, .icono-programa-2 span {
            font-size: 11px;
            color: white;
            margin-top: 5px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 2px 4px;
            border-radius: 3px;
            word-break: break-all;
        }

        .ventana-programa {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75%;
            height: 70%;
            max-width: 500px;
            max-height: 400px;
            border: 3px solid #222;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            flex-direction: column;
            z-index: 100;
        }

        @media (max-width: 768px) {
            .ventana-programa {
                width: 90%;
                height: 80%;
            }
            .contenedor-monitor {
                width: 100%;
                height: auto;
                aspect-ratio: auto;
            }
            .imagen-escritorio {
                object-fit: contain;
            }
        }

        .ventana-header {
            background: linear-gradient(90deg, #0055ff, #00aaff);
            padding: 5px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            color: white;
        }

        .boton-cerrar {
            background: #ff5555;
            border: 1px solid #aa0000;
            color: white;
            font-family: monospace;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 10px;
        }

        .ventana-cuerpo {
            flex-grow: 1;
            background-image: url('fondo.png');
            background-size: auto;
            position: relative;
            overflow: hidden;
        }

        .sprite {
            position: absolute;
            image-rendering: pixelated;
        }

        #personajeHana {
            width: 45px;
            height: auto;
            transition: transform 0.1s ease, left 0.1s linear, top 0.1s linear;
        }

        #objetoInteractivo {
            width: 40px;
            height: auto;
            bottom: 30px;
            right: 40px;
        }

        /* Sprites específicos para el nuevo juego ClanKath */
        #personajeZaf {
            width: 45px;
            height: auto;
            transition: transform 0.1s ease, left 0.1s linear, top 0.1s linear;
        }

        #personajeRuby {
            width: 45px;
            height: auto;
            top: 60px;
            right: 80px;
        }

        .cuadro-dialogo {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #fff;
            padding: 8px;
            font-size: 13px;
            color: #fff;
            font-family: monospace;
            border-radius: 4px;
            z-index: 10;
        }

        .dpad-contenedor {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 90px;
            height: 90px;
            z-index: 5;
        }

        .dpad-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            border-radius: 4px;
        }

        .btn-arriba { top: 0; left: 30px; }
        .btn-abajo { bottom: 0; left: 30px; }
        .btn-izquierda { top: 30px; left: 0; }
        .btn-derecha { top: 30px; right: 0; }

        .btn-accion-contenedor {
            display: none;
            position: absolute;
            bottom: 25px;
            right: 10px;
            z-index: 5;
        }

        .btn-accion {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        .pantalla-booteo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.5s ease-in-out;
            animation: encendidoCRT 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .logo-sadinux {
            max-width: 450px;
            height: auto;
            margin-bottom: 30px;
        }

        .consola-comandos {
            width: 450px;
            height: 120px;
            font-size: 13px;
            color: #aaaaaa;
            text-align: left;
            overflow: hidden;
            line-height: 1.5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .linea-comando {
            white-space: nowrap;
            overflow: hidden;
        }

        @keyframes encendidoCRT {
            0% {
                transform: scaleY(0.01) scaleX(0);
                background: #ffffff;
            }
            40% {
                transform: scaleY(0.01) scaleX(1);
                background: #ffffff;
            }
            100% {
                transform: scaleY(1) scaleX(1);
                background: #000000;
            }
        }

        .desvanecer-boot {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="efecto-crt"></div>

    <div id="escritorio" class="escritorio-sistema">
        <div class="contenedor-monitor">
            <img src="pantalla_inicio.png" alt="Escritorio Sadinux" class="imagen-escritorio">

            <!-- Icono original de HanaMind -->
            <div class="icono-programa" onclick="abrirVentanaHana()">
                <img src="icon.png" alt="Icono Hana Mind">
                <span>Hana_mind.exe</span>
            </div>

            <!-- Nuevo icono para ClanKath -->
            <div class="icono-programa-2" onclick="abrirVentanaClan()">
                <img src="icon2.png" alt="Icono ClanKath">
                <span>ClanKath.exe</span>
            </div>

            <!-- Ventana original de HanaMind -->
            <div id="ventanaHana" class="ventana-programa">
                <div class="ventana-header">
                    <span>Hana_mind.exe</span>
                    <button class="boton-cerrar" onclick="cerrarVentanaHana()">X</button>
                </div>
                <div class="ventana-cuerpo" id="zonaJuegoHana">
                    <img src="Hana.png" id="personajeHana" class="sprite" alt="Hana">
                    <img src="ball.png" id="objetoInteractivo" class="sprite" alt="Ball">
                    
                    <div id="cuadroDialogoHana" class="cuadro-dialogo"></div>

                    <div id="dpadHana" class="dpad-contenedor">
                        <div class="dpad-btn btn-arriba" data-dir="up">▲</div>
                        <div class="dpad-btn btn-izquierda" data-dir="left">◀</div>
                        <div class="dpad-btn btn-derecha" data-dir="right">▶</div>
                        <div class="dpad-btn btn-abajo" data-dir="down">▼</div>
                    </div>

                    <div id="btnAccionContHana" class="btn-accion-contenedor">
                        <div class="btn-accion" id="btnInteractuarHana">●</div>
                    </div>
                </div>
            </div>

            <!-- Nueva ventana independiente para ClanKath con 2 personajes de prueba (Zaf y Ruby) -->
            <div id="ventanaClan" class="ventana-programa">
                <div class="ventana-header">
                    <span>ClanKath.exe</span>
                    <button class="boton-cerrar" onclick="cerrarVentanaClan()">X</button>
                </div>
                <div class="ventana-cuerpo" id="zonaJuegoClan">
                    <img src="Zaf.png" id="personajeZaf" class="sprite" alt="Zaf">
                    <img src="Ruby.png" id="personajeRuby" class="sprite" alt="Ruby">
                    
                    <div id="cuadroDialogoClan" class="cuadro-dialogo"></div>

                    <div id="dpadClan" class="dpad-contenedor">
                        <div class="dpad-btn btn-arriba-clan" data-dir="up">▲</div>
                        <div class="dpad-btn btn-izquierda-clan" data-dir="left">◀</div>
                        <div class="dpad-btn btn-derecha-clan" data-dir="right">▶</div>
                        <div class="dpad-btn btn-abajo-clan" data-dir="down">▼</div>
                    </div>

                    <div id="btnAccionContClan" class="btn-accion-contenedor">
                        <div class="btn-accion" id="btnInteractuarClan">●</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="capaBoot" class="pantalla-booteo">
        <img src="sadinux_boot.png" alt="Sadinux 87 Logo" class="logo-sadinux">
        <div id="cajaConsola" class="consola-comandos"></div>
    </div>

    <script>
        const listaComandos = [
            "SADINUX KERNEL MULTI-THREAD V0.87 CONFIGURING...",
            "SINK-COMPANY MOTHERBOARD CORE READ: OK",
            "CHECKING FILESYSTEM VIRTUAL MEMORY... 640KB LOADED",
            "CONNECTING TO DEV/SDA1/OCTARION HUB... CONNECTED",
            "MOUNTING INBOUND DATA PACKETS FROM DREAMTOPIA...",
            "DECRYPTING REGISTER_CIVIL_DATABASE BASE SYSTEM...",
            "STARTING GRAPHICAL USER INTERFACE O_GUI.EXE...",
            "SADINUX BOOT SEQUENCE SUCCESSFUL,¥0ÚRS3CR3TŊ0T4M3."
        ];

        const contenedorConsola = document.getElementById("cajaConsola");
        let indiceLinea = 0;

        function imprimirSecuencia() {
            if (indiceLinea < listaComandos.length) {
                const parrafo = document.createElement("div");
                parrafo.className = "linea-comando";
                parrafo.textContent = ">> " + listaComandos[indiceLinea];
                contenedorConsola.appendChild(parrafo);
                indiceLinea++;
                setTimeout(imprimirSecuencia, 750);
            }
        }

        setTimeout(imprimirSecuencia, 800);

        setTimeout(function() {
            document.getElementById("capaBoot").classList.add("desvanecer-boot");
            const esc = document.getElementById("escritorio");
            esc.style.opacity = "1";
        }, 7000);

        let esMovil = false;
        window.addEventListener('touchstart', function detectTouch() {
            esMovil = true;
            if(ventanaHanaAbierta) mostrarControlesMovilesHana();
            if(ventanaClanAbierta) mostrarControlesMovilesClan();
            window.removeEventListener('touchstart', detectTouch);
        });

        // --- LÓGICA DE HANAMIND ---
        const ventanaHana = document.getElementById("ventanaHana");
        const hana = document.getElementById("personajeHana");
        const objetoObj = document.getElementById("objetoInteractivo");
        const dialogoHana = document.getElementById("cuadroDialogoHana");
        const zonaJuegoHana = document.getElementById("zonaJuegoHana");
        const dpadHana = document.getElementById("dpadHana");
        const btnAccionContHana = document.getElementById("btnAccionContHana");

        let hanaX = 20;
        let hanaY = 20;
        const velocidad = 15; 
        let ventanaHanaAbierta = false;
        let esMundoAlterno = false;

        function mostrarControlesMovilesHana() {
            if (esMovil) {
                dpadHana.style.display = "block";
                btnAccionContHana.style.display = "block";
            }
        }

        function abrirVentanaHana() {
            ventanaHana.style.display = "flex";
            ventanaHanaAbierta = true;
            actualizarPosicionHana();
            mostrarControlesMovilesHana();
            window.addEventListener("keydown", manejarTecladoHana);
        }

        function cerrarVentanaHana() {
            ventanaHana.style.display = "none";
            ventanaHanaAbierta = false;
            dialogoHana.style.display = "none";
            dpadHana.style.display = "none";
            btnAccionContHana.style.display = "none";
            window.removeEventListener("keydown", manejarTecladoHana);
        }

        function actualizarPosicionHana() {
            hana.style.left = hanaX + "px";
            hana.style.top = hanaY + "px";
        }

        function moverHana(direccion) {
            const limiteX = zonaJuegoHana.clientWidth - 45;
            const limiteY = zonaJuegoHana.clientHeight - 55;

            if (direccion === "up") hanaY = Math.max(0, hanaY - velocidad);
            if (direccion === "down") hanaY = Math.min(limiteY, hanaY + velocidad);
            if (direccion === "left") {
                hanaX = Math.max(0, hanaX - velocidad);
                hana.style.transform = "scaleX(-1)";
            }
            if (direccion === "right") {
                hanaX = Math.min(limiteX, hanaX + velocidad);
                hana.style.transform = "scaleX(1)";
            }
            dialogoHana.style.display = "none";
            actualizarPosicionHana();
        }

        function manejarTecladoHana(e) {
            if (!ventanaHanaAbierta) return;
            if (e.key === "ArrowUp") moverHana("up");
            if (e.key === "ArrowDown") moverHana("down");
            if (e.key === "ArrowLeft") moverHana("left");
            if (e.key === "ArrowRight") moverHana("right");
            if (e.key === "Enter") ejecutarInteraccionHana();
        }

        dpadHana.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                moverHana(this.getAttribute('data-dir'));
            });
        });

        document.getElementById('btnInteractuarHana').addEventListener('touchstart', function(e) {
            e.preventDefault();
            ejecutarInteraccionHana();
        });

        function ejecutarInteraccionHana() {
            if (verificarCercaniaHana()) {
                if (!esMundoAlterno) {
                    hana.src = "haneaf.png";
                    zonaJuegoHana.style.backgroundImage = "url('fondo2.jpg')";
                    objetoObj.src = "hanaworld.png";
                    dialogoHana.innerHTML = "<b>Sistema:</b> El entorno se ha distorsionado...";
                    esMundoAlterno = true;
                } else {
                    hana.src = "Hana.png";
                    zonaJuegoHana.style.backgroundImage = "url('fondo.png')";
                    objetoObj.src = "ball.png";
                    dialogoHana.innerHTML = "<b>Sistema:</b> Todo ha vuelto a la normalidad.";
                    esMundoAlterno = false;
                }
                dialogoHana.style.display = "block";
            }
        }

        function verificarCercaniaHana() {
            const rectHana = hana.getBoundingClientRect();
            const rectObj = objetoObj.getBoundingClientRect();
            const distancia = Math.sqrt(Math.pow((rectHana.left + rectHana.width/2) - (rectObj.left + rectObj.width/2), 2) + Math.pow((rectHana.top + rectHana.height/2) - (rectObj.top + rectObj.height/2), 2));
            return distancia < 80;
        }


        // --- LÓGICA DE CLANKATH (NUEVO JUEGO APARTE) ---
        const ventanaClan = document.getElementById("ventanaClan");
        const zaf = document.getElementById("personajeZaf");
        const ruby = document.getElementById("personajeRuby");
        const dialogoClan = document.getElementById("cuadroDialogoClan");
        const zonaJuegoClan = document.getElementById("zonaJuegoClan");
        const dpadClan = document.getElementById("dpadClan");
        const btnAccionContClan = document.getElementById("btnAccionContClan");

        let zafX = 50;
        let zafY = 50;
        let ventanaClanAbierta = false;

        function mostrarControlesMovilesClan() {
            if (esMovil) {
                dpadClan.style.display = "block";
                btnAccionContClan.style.display = "block";
            }
        }

        function abrirVentanaClan() {
            ventanaClan.style.display = "flex";
            ventanaClanAbierta = true;
            actualizarPosicionZaf();
            mostrarControlesMovilesClan();
            window.addEventListener("keydown", manejarTecladoClan);
        }

        function cerrarVentanaClan() {
            ventanaClan.style.display = "none";
            ventanaClanAbierta = false;
            dialogoClan.style.display = "none";
            dpadClan.style.display = "none";
            btnAccionContClan.style.display = "none";
            window.removeEventListener("keydown", manejarTecladoClan);
        }

        function actualizarPosicionZaf() {
            zaf.style.left = zafX + "px";
            zaf.style.top = zafY + "px";
        }

        function moverZaf(direccion) {
            const limiteX = zonaJuegoClan.clientWidth - 45;
            const limiteY = zonaJuegoClan.clientHeight - 55;

            if (direccion === "up") zafY = Math.max(0, zafY - velocidad);
            if (direccion === "down") zafY = Math.min(limiteY, zafY + velocidad);
            if (direccion === "left") {
                zafX = Math.max(0, zafX - velocidad);
                zaf.style.transform = "scaleX(-1)";
            }
            if (direccion === "right") {
                zafX = Math.min(limiteX, zafX + velocidad);
                zaf.style.transform = "scaleX(1)";
            }
            dialogoClan.style.display = "none";
            actualizarPosicionZaf();
        }

        function manejarTecladoClan(e) {
            if (!ventanaClanAbierta) return;
            if (e.key === "ArrowUp") moverZaf("up");
            if (e.key === "ArrowDown") moverZaf("down");
            if (e.key === "ArrowLeft") moverZaf("left");
            if (e.key === "ArrowRight") moverZaf("right");
            if (e.key === "Enter") ejecutarInteraccionClan();
        }

        dpadClan.querySelectorAll('.dpad-btn').forEach(btn => {
            btn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                moverZaf(this.getAttribute('data-dir'));
            });
        });

        document.getElementById('btnInteractuarClan').addEventListener('touchstart', function(e) {
            e.preventDefault();
            ejecutarInteraccionClan();
        });

        function ejecutarInteraccionClan() {
            const rectZaf = zaf.getBoundingClientRect();
            const rectRuby = ruby.getBoundingClientRect();
            const distancia = Math.sqrt(Math.pow((rectZaf.left + rectZaf.width/2) - (rectRuby.left + rectRuby.width/2), 2) + Math.pow((rectZaf.top + rectZaf.height/2) - (rectRuby.top + rectRuby.height/2), 2));

            if (distancia < 80) {
                dialogoClan.innerHTML = "<b>ClanKath:</b> ¡Hola Zaf! Bienvenid@ a las pruebas del nuevo juego.";
                dialogoClan.style.display = "block";
            } else {
                dialogoClan.innerHTML = "<b>ClanKath:</b> Acércate a Ruby para interactuar.";
                dialogoClan.style.display = "block";
            }
        }
    </script>
</body>
</html>
