<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión Local - IcyTv</title>
    <style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .gif-tv {
            width: 25vw; 
            height: auto;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        @media (max-width: 768px) {
            .gif-tv {
                width: 50vw;
            }
        }
    </style>
</head>
<body>

    <img src="icytv.gif" alt="Señal IcyTv" class="gif-tv">

</body>
</html>
