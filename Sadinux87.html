<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal - Sadinux87</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #020202;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }

        .contenedor-sadinux {
            text-align: center;
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }

        .interfaz-monitor {
            background: #000000;
            border: 2px solid #222222;
            border-radius: 6px;
            padding: 10px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            display: inline-block;
            max-width: 100%;
        }

        .imagen-sadinux {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
        }

        .logs-sistema {
            margin-top: 20px;
            color: #ff0055;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: left;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <main class="contenedor-sadinux">
        <div class="interfaz-monitor">
            <img src="https://lh3.googleusercontent.com/d/1M2wNiIiNC2cFxy_Kpj0fT01aPtCaw-yW" alt="Sistema Sadinux87" class="imagen-sadinux">
        </div>
        <div class="logs-sistema">
            <p>> ACCESSING CORE_DIR/SADINUX87...</p>
            <p>> STATUS: UNLOCKED_WORKSPACE</p>
        </div>
    </main>

</body>
</html>
