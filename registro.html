<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal de Registro - Municipio de Octarion</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #050505;
            overflow-y: auto !important;
            padding-top: 120px;
            padding-bottom: 60px;
        }
        .contenedor-registro {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            text-align: center;
        }
        .contenedor-registro h1 {
            color: #00ff00;
            letter-spacing: 5px;
            font-size: 28px;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        .aviso-oficial {
            color: #888;
            font-size: 14px;
            margin-bottom: 40px;
            line-height: 1.6;
            text-transform: uppercase;
        }
        .boton-registro {
            display: inline-block;
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 40px;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 60px;
        }
        .boton-registro:hover {
            background: #00ff00;
            color: #050505;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.6);
        }
        .bloque-historial {
            width: 100%;
            max-width: 750px;
            margin: 0 auto;
        }
        .bloque-historial h2 {
            color: #ff0055;
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
        }
        .contenedor-encriptado {
            width: 100%;
            height: 450px;
            border: 1px solid #222;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
            filter: invert(0.92) dashed hue-rotate(130deg) contrast(1.2);
        }
        .iframe-historial {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <nav>
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="cry.html" class="nav-link">CRY</a>
            <a href="dreamtopia.html" class="nav-link">Dreamtopia</a>
            <a href="registro.html" class="nav-link active">Registro</a>
        </nav>
    </header>

    <div class="contenedor-registro">
        <h1>[ SISTEMA CENTRAL DE CIUDADANÍA - MUNICIPIO DE OCTARION ]</h1>
        
        <div class="aviso-oficial">
            <p>CONTRATO OBLIGATORIO DE IDENTIFICACIÓN CIVIL.</p>
            <p>EL ALISTAMIENTO DEFINE SU ROL DENTRO DE LOS LÍMITES GEOGRÁFICOS DE ESTE MUNICIPIO.</p>
        </div>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLSenqbNB5ipqA2R2jv-eeiCFld-fMT-k8E_K4VZGzvBrqIOPhQ/viewform" target="_blank" class="boton-registro">
            [ INICIAR ALISTAMIENTO ]
        </a>

        <div class="bloque-historial">
            <h2>[ ARCHIVOS DE ALMAS AFILIADAS ]</h2>
            <div class="contenedor-encriptado">
                <iframe class="iframe-historial" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRA64h2FcOCGMvpwyMNSewbcFyPSYcX7ZcuSwDBBYw75-Ho9Us9DVudkDPT0h4zIZ6-r1dbotMSXAel/pubhtml?gid=941010130&amp;single=true&amp;widget=true&amp;headers=false&amp;chrome=false"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
